services:
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: redmine
      POSTGRES_DB: redmine_development

  web:
    build: .
    command: bundle exec rails server -p 3000 -b '0.0.0.0'
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://redmine:password@db/redmine_development
    depends_on:
      - db

  test:
    build: .
    volumes:
      - .:/app
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgresql://redmine:password@db/redmine_test
    depends_on:
      - db